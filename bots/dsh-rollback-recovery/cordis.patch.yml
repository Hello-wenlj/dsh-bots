# dsh-rollback-recovery as a DeepSeek Harness agent preset (exported by dsh-bundle-export).
- insert:
    - id: preset-dsh-rollback-recovery
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-rollback-recovery
        name: "dsh-rollback-recovery"
        description: "当需要回滚或恢复 DSH（DeepSeek Harness）时使用：dsh.sh 的 run/web/acp/version 起不来、升级后调用面异常、出口代理不生效（HTTP_PROXY/.env 分层）、需回退旧版本。固化 npm 回滚口径、四处版本敏感区（含 mcp.json）、4 项冒烟。"
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                当需要回滚或恢复 DSH（DeepSeek Harness）时使用：dsh.sh 的 run/web/acp/version 起不来、升级后调用面异常、出口代理不生效（HTTP_PROXY/.env 分层）、需回退旧版本。固化 npm 回滚口径、四处版本敏感区（含 mcp.json）、4 项冒烟。
          - id: dsh-rollback-recovery-skills
            name: ./skills.mjs
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            config:
              disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            config:
              disabled: true
